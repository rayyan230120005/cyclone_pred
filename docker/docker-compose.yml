# Tropical Cyclone Prediction System - container orchestration
#
#   docker compose up --build                   API + Redis
#   docker compose --profile triton up --build  + Triton GPU inference server
#   docker compose --profile train run trainer  one-off training job (needs NVIDIA GPU)
#
# Secrets come from ../.env (gitignored). Copy ../.env.example to ../.env first.
# `version:` is intentionally absent - it is obsolete in Compose v2 and emits a warning.

services:
  # ---------------------------------------------------------------------------
  # FastAPI deep learning & geospatial backend
  # ---------------------------------------------------------------------------
  cyclone-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cyclone_prediction_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - TRITON_SERVER_URL=triton-inference:8001
      - API_PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Best-track archives and imagery are large and change independently of the
      # image - mount them rather than baking them in at build time.
      - ../data:/app/data:ro
      # Trained weights, so a container restart does not lose them.
      - ../checkpoints:/app/checkpoints:ro
    depends_on:
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - cyclone-net

  # ---------------------------------------------------------------------------
  # Redis - distributed rate limiting & real-time caching
  # ---------------------------------------------------------------------------
  redis-cache:
    image: redis:7.2-alpine
    container_name: cyclone_redis
    restart: unless-stopped
    # Not published to the host: only the API and trainer need it, and an exposed
    # Redis with no auth is the classic way to lose a demo box.
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cyclone-net

  # ---------------------------------------------------------------------------
  # NVIDIA Triton inference server (optional - needs a GPU + NVIDIA Container Toolkit)
  # Enable with:  docker compose --profile triton up
  # ---------------------------------------------------------------------------
  triton-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile.triton
    container_name: cyclone_triton_server
    restart: unless-stopped
    profiles: ["triton"]
    ports:
      - "8001:8001"  # gRPC
      - "8002:8002"  # Prometheus metrics
    volumes:
      - ../triton_model_repository:/models:ro
    healthcheck:
      # Triton's readiness endpoint lives on its HTTP port (8000 inside the container).
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - cyclone-net

  # ---------------------------------------------------------------------------
  # Training job - one-off, not a long-running service.
  #   docker compose --profile train run --rm trainer
  #   docker compose --profile train run --rm trainer --basin arabian_sea --epochs 80
  #
  # Requires an NVIDIA GPU and the NVIDIA Container Toolkit. Run the IBTrACS
  # download on the host first (see TRAINING.md) - ../data is mounted read-write
  # here so a containerised download would also work.
  # ---------------------------------------------------------------------------
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    container_name: cyclone_trainer
    profiles: ["train"]
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../data:/app/data
      - ../checkpoints:/app/checkpoints
      - ../configs:/app/configs:ro
    # Overridable: anything after `run --rm trainer` replaces these flags.
    command: ["--all-basins", "--device", "cuda", "--batch-size", "32"]
    shm_size: "2gb"  # DataLoader workers share memory through /dev/shm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cyclone-net

networks:
  cyclone-net:
    driver: bridge

volumes:
  redis-data:
